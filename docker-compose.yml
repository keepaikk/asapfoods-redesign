services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - backend-data:/app/data
    networks:
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    expose:
      - "80"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jovivafoods.rule=Host(`jovivafoods.com`) || Host(`www.jovivafoods.com`)"
      - "traefik.http.routers.jovivafoods.entrypoints=websecure"
      - "traefik.http.routers.jovivafoods.tls.certResolver=letsencrypt"
      - "traefik.http.services.jovivafoods.loadbalancer.server.port=80"
    restart: unless-stopped

volumes:
  backend-data:
    driver: local

networks:
  dokploy-network:
    external: true
