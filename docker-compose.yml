version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - backend-data:/app/data
    networks:
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  backend-data:
    driver: local

networks:
  dokploy-network:
    external: true
