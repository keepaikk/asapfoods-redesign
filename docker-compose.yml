version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - joviva-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - joviva-network

volumes:
  backend-data:
    driver: local

networks:
  joviva-network:
    driver: bridge
